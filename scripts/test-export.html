<!DOCTYPE html>
<html lang="en">
<body>
  <h1>Test Export</h1>
  <input type="file" id="file" />
  <button id="btn">Run</button>
  <pre id="log"></pre>
  <script type="module">
    import { PDFDocument } from 'pdf-lib'
    import fontkit from '@pdf-lib/fontkit'
    import * as mupdf from 'mupdf'

    function log(msg) {
      document.getElementById('log').textContent += msg + '\n';
      console.log(msg);
    }

    document.getElementById('btn').onclick = async () => {
      try {
        const file = document.getElementById('file').files[0];
        if (!file) return log("No file selected");
        
        log("Reading file...");
        const arrayBuffer = await file.arrayBuffer();
        
        log("Redacting...");
        const baseDoc = mupdf.Document.openDocument(arrayBuffer, 'application/pdf');
        const doc = baseDoc.asPDF();
        const page = doc.loadPage(0);
        const annot = page.createAnnotation('Redact');
        annot.setRect([0, 0, 1000, 1000]);
        page.applyRedactions(true);
        page.update();
        const outBuf = doc.saveToBuffer("");
        const mutationBase = new Uint8Array(outBuf.asUint8Array());
        window.mupdfBytes = mutationBase;
        
        log("Mutation base length: " + mutationBase.length);
        
        log("Loading in pdf-lib...");
        const originalPdf = await PDFDocument.load(mutationBase);
        
        log("Creating new PDF...");
        const pdf = await PDFDocument.create();
        pdf.registerFontkit(fontkit);
        
        const [copiedPage] = await pdf.copyPages(originalPdf, [0]);
        pdf.addPage(copiedPage);
        
        log("Saving PDF...");
        const finalBytes = await pdf.save(); window.finalBytes = finalBytes;
        log("Success! size: " + finalBytes.length);
      } catch (e) {
        log("ERROR: " + e.message);
        log(e.stack);
      }
    };
  </script>
</body>
</html>
