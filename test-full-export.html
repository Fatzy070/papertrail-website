<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Full Export</title>
</head>
<body>
  <h1>Test Full Export</h1>
  <input type="file" id="file" />
  <button id="btn">Run</button>
  
  <script type="module" src="./test-full-export.js"></script>
  <script type="module">
    document.getElementById('btn').onclick = async () => {
      const file = document.getElementById('file').files[0];
      if (!file) return console.log("No file selected");
      const res = await window.runFullExportTest(file);
      window.testResult = res;
    }
  </script>
</body>
</html>
